<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكاة حركة كرة القدم</title>
    <style>
        :root {
            color-scheme: dark;
            --panel: rgba(8, 14, 18, 0.82);
            --panel-border: rgba(255, 255, 255, 0.14);
            --accent: #43d17a;
            --text: #f4f7f5;
            --muted: #aab8b1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #101619;
            font-family: Arial, Tahoma, sans-serif;
            cursor: default;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .panel {
            position: absolute;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--panel-border);
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(10px);
            user-select: none;
        }

        #info {
            top: 12px;
            left: 12px;
            max-width: 310px;
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.75;
            pointer-events: none;
            direction: rtl;
        }

        #info h3 {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 16px;
        }

        #impact-control {
            top: 12px;
            left: 12px;
            width: 178px;
            padding: 12px;
            border-radius: 8px;
            z-index: 22;
            direction: rtl;
        }

        .impact-title {
            margin: 0 0 9px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
        }

        .impact-pad {
            position: relative;
            width: 138px;
            height: 138px;
            margin: 0 auto;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background:
                radial-gradient(circle at center, rgba(255, 255, 255, 0.18) 0 2px, transparent 3px),
                linear-gradient(90deg, transparent 49%, rgba(255, 255, 255, 0.24) 50%, transparent 51%),
                linear-gradient(0deg, transparent 49%, rgba(255, 255, 255, 0.24) 50%, transparent 51%),
                radial-gradient(circle at 38% 30%, rgba(255, 255, 255, 0.2), rgba(67, 209, 122, 0.12) 48%, rgba(3, 8, 11, 0.62) 72%);
            cursor: pointer;
            touch-action: none;
        }

        .impact-pad::after {
            content: "";
            position: absolute;
            inset: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
        }

        .impact-marker {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #06100b;
            background: #7ee7a7;
            box-shadow: 0 0 18px rgba(126, 231, 167, 0.75);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .impact-readout {
            margin-top: 9px;
            color: var(--muted);
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
            direction: rtl;
        }

        .lil-gui.lil-root.compact-football-gui {
            width: 258px !important;
            max-height: calc(100vh - 24px);
            position: fixed !important;
            top: 12px !important;
            right: 12px !important;
            z-index: 20;
            overflow: hidden;
            direction: ltr;
            text-align: right;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.34);
            backdrop-filter: blur(10px);
            --background-color: rgba(8, 14, 18, 0.88);
            --title-background-color: rgba(3, 8, 11, 0.92);
            --title-text-color: var(--accent);
            --text-color: var(--text);
            --widget-color: rgba(255, 255, 255, 0.1);
            --hover-color: rgba(255, 255, 255, 0.16);
            --focus-color: rgba(67, 209, 122, 0.32);
            --number-color: #7ee7a7;
            --string-color: #c4f3d4;
            --font-family: Arial, Tahoma, sans-serif;
            --font-size: 11px;
            --input-font-size: 11px;
            --widget-height: 20px;
            --padding: 4px;
            --spacing: 4px;
            --name-width: 50%;
            --folder-indent: 5px;
            --widget-border-radius: 3px;
        }

        .compact-football-gui > .lil-children {
            max-height: calc(100vh - 54px);
        }

        .compact-football-gui .lil-title,
        .compact-football-gui .lil-name {
            direction: rtl;
            text-align: right;
            unicode-bidi: isolate;
        }

        .compact-football-gui .lil-controller > .lil-name {
            padding-right: var(--spacing);
            padding-left: 0;
        }

        .compact-football-gui .lil-controller.lil-number.lil-has-slider input {
            margin-left: var(--spacing);
            margin-right: 0;
        }

        .compact-football-gui .lil-controller.lil-option .lil-display {
            direction: rtl;
            text-align: right;
            padding-left: 1.75em;
            padding-right: 0.55em;
        }

        .compact-football-gui .lil-controller.lil-option .lil-display::after {
            right: auto;
            left: 0;
            padding-right: 0;
            padding-left: 0.375em;
        }

        .compact-football-gui .lil-controller.lil-function button {
            color: #06100b;
            font-weight: 700;
            background: var(--accent);
        }

        @media (max-width: 760px) {
            #info {
                display: none;
            }

            #impact-control {
                width: 154px;
                padding: 9px;
                left: 8px;
                top: 8px;
            }

            .impact-pad {
                width: 116px;
                height: 116px;
            }

            .lil-gui.lil-root.compact-football-gui {
                width: min(244px, calc(100vw - 16px)) !important;
                right: 8px;
                top: 8px;
                max-height: 46vh;
            }

            .compact-football-gui > .lil-children {
                max-height: calc(46vh - 24px);
            }
        }
    </style>
</head>
<body>

    <div id="impact-control" class="panel">
        <div class="impact-title">نقطة الصدم</div>

            <div id="impact-marker" class="impact-marker"></div>
        </div>
        <div id="impact-readout" class="impact-readout"></div>
    </div>
    <script type="module" src="main.js"></script>
</body>
</html>
